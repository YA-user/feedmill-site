services:
  app:
    build: .
    container_name: feedmill-site
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
      ADMIN_EMAIL: admin@agrokorm.local
      DB_PATH: /var/www/html/storage/feedmill.sqlite
    volumes:
      - feedmill_storage:/var/www/html/storage
      - feedmill_uploads:/var/www/html/public/uploads

volumes:
  feedmill_storage:
  feedmill_uploads:
